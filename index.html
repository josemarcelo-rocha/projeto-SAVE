<!DOCTYPE html>

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // Configure Tailwind Custom Colors from Prompt Specification
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              lightBg: '#F6F7F7',
              cardDark: '#363F44',
              darkBg: '#0D1117',
              darkerBg: '#06080B',
              red: '#AC0815',
              redHover: '#87050F'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #363F44;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #AC0815;
    }

    /* Glassmorphism & Visual Polish */
    .glass-card {
      backdrop-filter: blur(8px);
    }

    .badge-status {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    /* ===================================================================
       APPLICATION CORE CONTROLLER (GLOBAL SCOPE)
       =================================================================== */
    class SAVEApp {
      constructor() {
        this.db = null;
        this.currentUser = null;
        this.currentTheme = 'auto';
        this.init();
      }

      init() {
        // Load Database from LocalStorage or seed defaults
        const localData = localStorage.getItem('SAVE_DB_V1');
        if (!localData) {
          this.db = DEFAULT_DB;
          // Seed draft as a clone of real initially
          this.db.horarioRascunho = JSON.parse(JSON.stringify(DEFAULT_DB.horarioReal));
          this.saveDB();
        } else {
          try {
            this.db = JSON.parse(localData);
          } catch(e) {
            this.db = DEFAULT_DB;
            this.saveDB();
          }
        }

        // Load Theme
        const savedTheme = localStorage.getItem('SAVE_THEME') || 'auto';
        this.setTheme(savedTheme, false);

        // Load active session if exists
        const savedSession = sessionStorage.getItem('SAVE_SESSION');
        if (savedSession) {
          try {
            this.currentUser = JSON.parse(savedSession);
          } catch (e) {
            this.currentUser = null;
          }
        }

        this.renderHeader();
        this.navigateToHome();
        this.bindEvents();
      }

      saveDB() {
        localStorage.setItem('SAVE_DB_V1', JSON.stringify(this.db));
      }

      bindEvents() {
        // Close dropdown when clicking outside
        window.addEventListener('click', (e) => {
          const wrapper = document.getElementById('theme-dropdown-wrapper');
          if (wrapper && !wrapper.contains(e.target)) {
            const dropdown = document.getElementById('theme-dropdown');
            if (dropdown) dropdown.classList.add('hidden');
          }
        });
      }

      setTheme(mode, notify = true) {
        this.currentTheme = mode;
        localStorage.setItem('SAVE_THEME', mode);
        const html = document.documentElement;
        const icon = document.getElementById('theme-btn-icon');

        if (mode === 'dark') {
          html.classList.add('dark');
          if (icon) icon.className = 'fa-solid fa-moon text-indigo-400';
        } else if (mode === 'light') {
          html.classList.remove('dark');
          if (icon) icon.className = 'fa-solid fa-sun text-amber-500';
        } else {
          // Auto
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) {
            html.classList.add('dark');
            if (icon) icon.className = 'fa-solid fa-desktop text-emerald-500';
          } else {
            html.classList.remove('dark');
            if (icon) icon.className = 'fa-solid fa-desktop text-emerald-500';
          }
        }

        const dropdown = document.getElementById('theme-dropdown');
        if (dropdown) dropdown.classList.add('hidden');

        if (notify) this.toast(`Tema alterado para: ${mode.toUpperCase()}`, 'info');
      }

      toggleThemeDropdown() {
        const dropdown = document.getElementById('theme-dropdown');
        if (dropdown) dropdown.classList.toggle('hidden');
      }

      toast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const colors = {
          success: 'bg-emerald-600 text-white border-emerald-500',
          error: 'bg-brand-red text-white border-red-500',
          info: 'bg-slate-800 text-white border-slate-700',
          warning: 'bg-amber-500 text-white border-amber-400'
        };

        const icons = {
          success: 'fa-circle-check',
          error: 'fa-triangle-exclamation',
          info: 'fa-circle-info',
          warning: 'fa-triangle-exclamation'
        };

        const toastEl = document.createElement('div');
        toastEl.className = `p-4 rounded-xl shadow-xl border flex items-center gap-3 transition-all transform translate-y-2 opacity-0 text-sm font-medium ${colors[type] || colors.info} pointer-events-auto`;
        toastEl.innerHTML = `
          <i class="fa-solid ${icons[type] || 'fa-circle-info'} text-lg"></i>
          <span class="flex-1">${message}</span>
          <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 p-1"><i class="fa-solid fa-xmark"></i></button>
        `;

        container.appendChild(toastEl);

        setTimeout(() => {
          toastEl.classList.remove('translate-y-2', 'opacity-0');
        }, 10);

        setTimeout(() => {
          toastEl.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toastEl.remove(), 300);
        }, 4000);
      }

      renderHeader() {
        const userInfoBox = document.getElementById('header-user-info');
        const userNameEl = document.getElementById('header-user-name');
        const userRoleEl = document.getElementById('header-user-role');

        if (this.currentUser) {
          userInfoBox.classList.remove('hidden');
          userNameEl.innerText = this.currentUser.nome || 'Usuário';
          userRoleEl.innerText = this.currentUser.role;
        } else {
          userInfoBox.classList.add('hidden');
        }
      }

      login(userData) {
        this.currentUser = userData;
        sessionStorage.setItem('SAVE_SESSION', JSON.stringify(userData));
        this.renderHeader();
        this.toast(`Bem-vindo(a), ${userData.nome}!`, 'success');
        this.navigateToHome();
      }

      logout() {
        this.currentUser = null;
        sessionStorage.removeItem('SAVE_SESSION');
        this.renderHeader();
        this.toast('Sessão encerrada com sucesso.', 'info');
        this.navigateToHome();
      }

      navigateToHome() {
        if (!this.currentUser) {
          this.renderLoginView();
          return;
        }

        switch (this.currentUser.role) {
          case 'aluno':
            this.renderAlunoView();
            break;
          case 'responsavel':
            this.renderResponsavelView();
            break;
          case 'professor':
            this.renderProfessorView();
            break;
          case 'administrador':
          case 'assistente':
            this.renderAdminView();
            break;
          case 'visitante':
            this.renderVisitanteView();
            break;
          default:
            this.renderLoginView();
        }
      }

      validatePasswordRules(password, userRef = {}) {
        if (!password || password.length < 8 || password.length > 16) {
          return 'A senha deve conter entre 8 e 16 caracteres.';
        }
        if (!/[a-zA-Z]/.test(password)) {
          return 'A senha deve conter pelo menos uma letra.';
        }
        if (!/[0-9]/.test(password)) {
          return 'A senha deve conter pelo menos um número.';
        }
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
          return 'A senha deve conter pelo menos um caractere especial (!@#$%^&*...).';
        }

        const lowerPass = password.toLowerCase();
        
        // Check forbidden terms
        if (userRef.login && lowerPass.includes(userRef.login.toLowerCase())) {
          return 'A senha não pode conter o seu nome de usuário.';
        }
        if (userRef.rm && lowerPass.includes(userRef.rm.toString())) {
          return 'A senha não pode conter o seu RM.';
        }
        if (userRef.cpf) {
          const rawCpf = userRef.cpf.replace(/\D/g, '');
          if (rawCpf && lowerPass.includes(rawCpf)) {
            return 'A senha não pode conter o seu CPF.';
          }
        }

        return null; // Valid!
      }

      handleLoginSubmit(e) {
        e.preventDefault();
        const role = document.getElementById('login-role').value;
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        if (!identifier || !password) {
          this.toast('Preencha todos os campos obrigatórios.', 'error');
          return;
        }

        // Match against database
        const user = this.db.users.find(u => {
          if (u.role !== role) return false;
          if (role === 'aluno' || role === 'responsavel') {
            return u.rm === identifier && u.senhaHash === password;
          } else {
            return u.login === identifier && u.senhaHash === password;
          }
        });

        if (user) {
          this.login(user);
        } else {
          this.toast('Credenciais inválidas ou cadastro não localizado para o perfil selecionado.', 'error');
        }
      }

      handleFirstAccessSubmit(e) {
        e.preventDefault();
        const role = document.getElementById('fa-role').value;
        const pass = document.getElementById('fa-pass').value;
        const passConfirm = document.getElementById('fa-pass-confirm').value;

        if (pass !== passConfirm) {
          this.toast('As senhas digitadas não coincidem.', 'error');
          return;
        }

        let userToMatch = null;

        if (role === 'aluno') {
          const rm = document.getElementById('fa-rm').value.trim();
          const nome = document.getElementById('fa-nome-aluno').value.trim();
          const cpf = document.getElementById('fa-cpf-aluno').value.trim();

          userToMatch = this.db.users.find(u => u.role === 'aluno' && u.rm === rm && u.nome.toLowerCase() === nome.toLowerCase() && u.cpf.replace(/\D/g, '') === cpf.replace(/\D/g, ''));
        } else if (role === 'responsavel') {
          const rm = document.getElementById('fa-rm').value.trim();
          const nomeResp = document.getElementById('fa-nome-resp').value.trim();
          const cpf = document.getElementById('fa-cpf').value.trim();

          userToMatch = this.db.users.find(u => u.role === 'responsavel' && u.rm === rm && u.nome.toLowerCase() === nomeResp.toLowerCase() && u.cpf.replace(/\D/g, '') === cpf.replace(/\D/g, ''));
        } else if (role === 'professor') {
          const nomeProf = document.getElementById('fa-nome-prof').value.trim();
          const cpfProf = document.getElementById('fa-cpf-prof').value.trim();

          userToMatch = this.db.users.find(u => u.role === 'professor' && u.nome.toLowerCase() === nomeProf.toLowerCase() && u.cpf.replace(/\D/g, '') === cpfProf.replace(/\D/g, ''));
        }

        if (!userToMatch) {
          this.toast('Dados de cadastro prévio não localizados no sistema. Fale com a Administração.', 'error');
          return;
        }

        // Validate password against rule
        const passErr = this.validatePasswordRules(pass, userToMatch);
        if (passErr) {
          this.toast(passErr, 'error');
          return;
        }

        // Save new password
        userToMatch.senhaHash = pass;
        this.saveDB();
        this.closeModal();
        this.toast('Senha cadastrada com sucesso! Agora você já pode fazer login.', 'success');
      }

      sendQuickChat(msg) {
        const input = document.getElementById('chat-input');
        if (input) {
          input.value = msg;
          input.form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }
      }

      handleChatSubmit(e, isVisitor) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const query = input.value.trim();
        if (!query) return;

        input.value = '';
        this.appendChatMessage(query, 'user');

        // Processing Answer from KB
        setTimeout(() => {
          const reply = this.processChatQuery(query, isVisitor);
          this.appendChatMessage(reply, 'bot');
        }, 300);
      }

      appendChatMessage(text, sender) {
        const chatBox = document.getElementById('chat-messages');
        if (!chatBox) return;

        const msgDiv = document.createElement('div');
        msgDiv.className = `flex gap-2 max-w-[85%] ${sender === 'user' ? 'ml-auto justify-end' : ''} animate-fadeIn`;

        if (sender === 'bot') {
          msgDiv.innerHTML = `
            <div class="w-7 h-7 rounded-lg bg-brand-red text-white flex items-center justify-center shrink-0 font-bold">S</div>
            <div class="bg-white dark:bg-brand-cardDark p-3 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700/80 shadow-sm text-slate-700 dark:text-slate-200">
              ${text}
            </div>
          `;
        } else {
          msgDiv.innerHTML = `
            <div class="bg-brand-red text-white p-3 rounded-2xl rounded-tr-none shadow-sm">
              ${text}
            </div>
            <div class="w-7 h-7 rounded-lg bg-slate-700 text-white flex items-center justify-center shrink-0 font-bold">U</div>
          `;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      processChatQuery(query, isVisitor) {
        const lowerQ = query.toLowerCase();

        if (isVisitor) {
          // Limited Visitor Chat logic
          if (lowerQ.includes('curso') || lowerQ.includes('escola') || lowerQ.includes('endereço') || lowerQ.includes('contato')) {
            return "A instituição oferece turmas do Ensino Médio regular. Atendimento de Segunda a Sexta, das 07h30 às 18h00. E-mail: contato@escola.edu.br.";
          }
          if (lowerQ.includes('calendario') || lowerQ.includes('evento')) {
            return "Você pode consultar as datas de início das aulas e eventos gerais na aba Calendário do perfil de Visitante!";
          }
          return "Como visitante, meu acesso é limitado a orientações públicas. Para solicitar documentos ou atestados, faça login no sistema.";
        }

        // Full KB Search for Authenticated Users
        let bestMatch = null;
        let maxMatches = 0;

        this.db.knowledgeBase.forEach(kb => {
          const keywords = kb.palavrasChave.split(' ');
          let matches = 0;
          keywords.forEach(kw => {
            if (lowerQ.includes(kw.toLowerCase())) matches++;
          });
          if (matches > maxMatches) {
            maxMatches = matches;
            bestMatch = kb;
          }
        });

        if (bestMatch && maxMatches > 0) {
          return `<strong>${bestMatch.pergunta}</strong><br><br>${bestMatch.resposta}`;
        }

        return "Desculpe, não encontrei uma resposta exata para essa dúvida no meu banco de dados atual. Experimente utilizar palavras como <em>atestado, rematrícula, histórico, calendário ou horários</em>.";
      }

      updateHorarioGrid() {
        const tbody = document.getElementById('horarios-tbody');
        if (!tbody) return;

        const fTurma = document.getElementById('filter-horario-turma').value;
        const fDia = document.getElementById('filter-horario-dia').value;
        const fPeriodo = document.getElementById('filter-horario-periodo').value;
        const fProf = document.getElementById('filter-horario-prof').value;

        const slots = this.db.horarioConfig.slots;
        const dias = this.db.horarioConfig.dias;

        tbody.innerHTML = '';

        slots.forEach(slot => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-slate-200 dark:border-slate-700/60 hover:bg-slate-50/50 dark:hover:bg-slate-800/30';

          let timeCell = `<td class="p-3 font-mono font-bold bg-slate-50/80 dark:bg-brand-darkerBg/80 border-r border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">${slot.inicio} - ${slot.fim}</td>`;
          let cellsHtml = '';

          dias.forEach(dia => {
            if (fDia !== 'TODOS' && fDia !== dia) {
              cellsHtml += `<td class="p-3 border-r border-slate-200 dark:border-slate-700 text-center opacity-30 bg-slate-100 dark:bg-slate-900">-</td>`;
              return;
            }

            // Find matching schedule entries in real active timetable
            let matches = this.db.horarioReal.filter(h => h.slotId === slot.id && h.dia === dia);

            // Apply filters
            if (fTurma !== 'TODAS') matches = matches.filter(h => h.turmaId === fTurma);
            if (fProf !== 'TODOS') matches = matches.filter(h => h.profLogin === fProf);
            if (fPeriodo !== 'TODOS') {
              matches = matches.filter(h => {
                const turmaObj = this.db.turmas.find(t => t.id === h.turmaId);
                return turmaObj && turmaObj.periodo === fPeriodo;
              });
            }

            if (matches.length === 0) {
              cellsHtml += `<td class="p-3 border-r border-slate-200 dark:border-slate-700 text-center text-slate-400 font-light">Livre</td>`;
            } else {
              const cellContent = matches.map(m => {
                const disc = this.db.disciplinas.find(d => d.id === m.discId);
                const turma = this.db.turmas.find(t => t.id === m.turmaId);
                const prof = this.db.users.find(u => u.login === m.profLogin);

                return `
                  <div class="p-2 rounded-xl bg-brand-red/10 border border-brand-red/30 mb-1 text-left space-y-0.5">
                    <div class="font-bold text-brand-red">${disc ? disc.nome : 'Disciplina'} (${disc ? disc.sigla : ''})</div>
                    <div class="text-[10px] text-slate-600 dark:text-slate-300"><i class="fa-solid fa-users text-slate-400"></i> ${turma ? turma.nome : ''}</div>
                    <div class="text-[10px] text-slate-500"><i class="fa-solid fa-chalkboard-user text-slate-400"></i> ${prof ? prof.nome : m.profLogin}</div>
                  </div>
                `;
              }).join('');

              cellsHtml += `<td class="p-2 border-r border-slate-200 dark:border-slate-700 align-top">${cellContent}</td>`;
            }
          });

          tr.innerHTML = timeCell + cellsHtml;
          tbody.appendChild(tr);
        });
      }

        const dias = parseInt(document.getElementById('atestado-dias').value);
        const curso = document.getElementById('atestado-curso').value;
        const fileInput = document.getElementById('atestado-file');

        if (!dataAtestado || !dias || !fileInput.files[0]) {
          this.toast('Preencha a data, número de dias e selecione o arquivo.', 'error');

          dataEnvio: new Date().toISOString().split('T')[0],
          status: 'Pendente',
          motivoRecusa: '',

      handleRequerimentoSubmit(e) {
        e.preventDefault();
        const user = this.currentUser;
        const tipo = document.getElementById('req-tipo').value;
        const motivo = document.getElementById('req-motivo').value.trim();
        const complemento = document.getElementById('req-complemento').value.trim();

        if (!tipo || !motivo) {
          this.toast('Informe o tipo do documento e o motivo do pedido.', 'error');
          return;
        }

        const newReq = {
          id: 'REQ-' + Math.floor(Math.random() * 9000 + 1000),
          rmAluno: user.rm,
          nomeAluno: user.alunoNome || user.nome,
          tipo: tipo,
          motivo: motivo,
          complemento: complemento,
          dataCriacao: new Date().toISOString().split('T')[0],
          status: 'Pendente',
          motivoRecusa: ''
        };

        this.db.requerimentos.unshift(newReq);
        this.saveDB();
        this.toast('Requerimento enviado com sucesso!', 'success');
        
        if (user.role === 'aluno') this.switchAlunoTab('requerimentos');
        if (user.role === 'responsavel') this.switchRespTab('requerimentos');

      openEditRequerimentoModal(reqId) {
        const req = this.db.requerimentos.find(r => r.id === reqId);
        if (!req || req.status !== 'Pendente') {
          this.toast('Este requerimento não pode mais ser alterado.', 'error');
          return;
        }

        const modal = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');

        content.innerHTML = `
          <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-700">
            <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
              <i class="fa-solid fa-pen-to-square text-brand-red"></i> Editar Requerimento Pendente
            </h3>
            <button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <form onsubmit="app.handleSaveEditRequerimento(event, '${req.id}')" class="space-y-4 mt-4">
            <div>
              <label class="block text-xs font-bold mb-1">Motivo do Pedido *</label>
              <textarea id="edit-req-motivo" required rows="2" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-brand-darkerBg border border-slate-200 dark:border-slate-700 text-xs">${req.motivo}</textarea>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Informações Complementares</label>
              <textarea id="edit-req-complemento" rows="2" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-brand-darkerBg border border-slate-200 dark:border-slate-700 text-xs">${req.complemento || ''}</textarea>
            </div>

            <div class="flex justify-end gap-2 pt-3">
              <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-200 dark:bg-slate-700">Cancelar</button>
              <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-red text-white hover:bg-brand-redHover shadow">Salvar Alterações</button>
            </div>
          </form>
        `;

        modal.classList.remove('hidden');
      }

      handleSaveEditRequerimento(e, reqId) {
        e.preventDefault();
        const req = this.db.requerimentos.find(r => r.id === reqId);
        if (req && req.status === 'Pendente') {
          req.motivo = document.getElementById('edit-req-motivo').value.trim();
          req.complemento = document.getElementById('edit-req-complemento').value.trim();
          this.saveDB();
          this.closeModal();
          this.toast('Requerimento atualizado com sucesso.', 'success');

          if (this.currentUser.role === 'aluno') this.switchAlunoTab('requerimentos');
          if (this.currentUser.role === 'responsavel') this.switchRespTab('requerimentos');
        }
      }

      deleteRequerimento(reqId) {
        const reqIndex = this.db.requerimentos.findIndex(r => r.id === reqId);
        if (reqIndex !== -1 && this.db.requerimentos[reqIndex].status === 'Pendente') {
          this.db.requerimentos.splice(reqIndex, 1);
          this.saveDB();
          this.toast('Requerimento excluído com sucesso.', 'info');

          if (this.currentUser.role === 'aluno') this.switchAlunoTab('requerimentos');
          if (this.currentUser.role === 'responsavel') this.switchRespTab('requerimentos');
        }
      }

      renderAdminRascunhoGrid() {
        const tbody = document.getElementById('admin-draft-tbody');
        if (!tbody) return;

        const turmaId = document.getElementById('admin-draft-turma').value;
        const slots = this.db.horarioConfig.slots;
        const dias = this.db.horarioConfig.dias;
        const disciplinasTurma = this.db.disciplinas.filter(d => d.turmaId === turmaId);

        tbody.innerHTML = '';

        // Conflict check across all turmas in draft mode
        let conflictDetected = false;
        let conflictDetails = '';

        slots.forEach(slot => {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-slate-200 dark:border-slate-700/60';

          let timeCell = `<td class="p-3 font-mono font-bold bg-slate-50/80 dark:bg-brand-darkerBg/80 border-r border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">${slot.inicio} - ${slot.fim}</td>`;
          let cellsHtml = '';

          dias.forEach(dia => {
            // Find assigned discipline in draft for this turma, day and slot
            const currentEntry = this.db.horarioRascunho.find(h => h.turmaId === turmaId && h.dia === dia && h.slotId === slot.id);

            // Select dropdown with available subjects
            let optionsHtml = `<option value="">-- Horário Livre --</option>`;
            disciplinasTurma.forEach(disc => {
              const selected = currentEntry && currentEntry.discId === disc.id ? 'selected' : '';
              optionsHtml += `<option value="${disc.id}" ${selected}>${disc.nome} (${disc.sigla})</option>`;
            });

            // Check if teacher has conflict in ANOTHER turma at this same day & slot
            if (currentEntry) {
              const assignedDisc = this.db.disciplinas.find(d => d.id === currentEntry.discId);
              if (assignedDisc && assignedDisc.profLogin) {
                // Check if this prof is assigned anywhere else at the exact same day & slot
                const conflict = this.db.horarioRascunho.find(h => h.dia === dia && h.slotId === slot.id && h.turmaId !== turmaId && h.profLogin === assignedDisc.profLogin);
                if (conflict) {
                  conflictDetected = true;
                  const prof = this.db.users.find(u => u.login === assignedDisc.profLogin);
                  conflictDetails = `O professor ${prof ? prof.nome : assignedDisc.profLogin} possui choque de horário na ${dia} às ${slot.inicio}!`;
                }
              }
            }

            cellsHtml += `
              <td class="p-2 border-r border-slate-200 dark:border-slate-700">
                <select onchange="app.updateDraftSlot('${turmaId}', '${dia}', ${slot.id}, this.value)" class="w-full p-2 rounded-xl bg-slate-50 dark:bg-brand-darkerBg border border-slate-200 dark:border-slate-700 text-xs font-medium focus:ring-2 focus:ring-brand-red">
                  ${optionsHtml}
                </select>
              </td>
            `;
          });

          tr.innerHTML = timeCell + cellsHtml;
          tbody.appendChild(tr);
        });

        // Toggle Conflict Warning Banner
        const warnBox = document.getElementById('draft-conflict-warning');
        const warnMsg = document.getElementById('draft-conflict-msg');
        if (warnBox && warnMsg) {
          if (conflictDetected) {
            warnBox.classList.remove('hidden');
            warnMsg.innerText = conflictDetails;
          } else {
            warnBox.classList.add('hidden');
          }
        }
      }

      updateDraftSlot(turmaId, dia, slotId, discId) {
        // Remove existing entry for this slot
        const idx = this.db.horarioRascunho.findIndex(h => h.turmaId === turmaId && h.dia === dia && h.slotId === slotId);
        if (idx !== -1) {
          this.db.horarioRascunho.splice(idx, 1);
        }

        if (discId) {
          const disc = this.db.disciplinas.find(d => d.id === discId);
          this.db.horarioRascunho.push({
            turmaId: turmaId,
            dia: dia,
            slotId: slotId,
            discId: discId,
            profLogin: disc ? disc.profLogin : ''
          });
        }

        this.saveDB();
        this.renderAdminRascunhoGrid();
      }

        if (role === 'aluno') {
          const rm = document.getElementById('usr-rm').value.trim();

          const cpfAluno = document.getElementById('usr-cpf-aluno').value.trim();
          const turmaId = document.getElementById('usr-turma').value;
          const resp1 = document.getElementById('usr-resp1').value.trim();
          const resp2 = document.getElementById('usr-resp2').value.trim();

          const turmaObj = this.db.turmas.find(t => t.id === turmaId);

          // Create Student
          const studentUser = {
            id: systemId,
            role: 'aluno',
            rm: rm,
            nome: nomeAluno,
            cpf: cpfAluno,
            turmaId: turmaId,
            nomeTurma: turmaObj ? turmaObj.nome : '',
            resp1Nome: resp1,
            resp2Nome: resp2,
            senhaHash: 'Aluno123!' // default initial
          };

          // Auto-create Parent User
          const parentUser = {
            id: 'SYS-' + Math.floor(Math.random() * 9000 + 1000),
            role: 'responsavel',
            rm: rm,
            nome: resp1,
            alunoNome: nomeAluno,
            cpf: cpfAluno,
            turmaId: turmaId,
            nomeTurma: turmaObj ? turmaObj.nome : '',
            senhaHash: 'Resp123!'
          };

          this.db.users.push(studentUser, parentUser);
        } else if (role === 'professor') {
          const nomeProf = document.getElementById('usr-nome-prof').value.trim();
          const cpfProf = document.getElementById('usr-cpf-prof').value.trim();
          const loginProf = document.getElementById('usr-login-prof').value.trim();

            id: systemId,
            role: 'professor',
            login: loginProf,
            nome: nomeProf,
            cpf: cpfProf,
            senhaHash: 'Prof123!'
          };

          this.db.users.push(profUser);

          const cpf = document.getElementById('usr-cpf-admin').value.trim();
          const login = document.getElementById('usr-login-admin').value.trim();

            nome: nome,

          };

          this.db.users.push(adminUser);

        this.toast('Usuário(s) cadastrado(s) com sucesso!', 'success');
        this.switchAdminTab('usuarios');

        `;
      }

      updateReqStatus(reqId, newStatus) {
        const req = this.db.requerimentos.find(r => r.id === reqId);
        if (req) {
          req.status = newStatus;
          this.saveDB();
          this.toast(`Status do requerimento ${reqId} alterado para: ${newStatus}`, 'success');
          this.switchAdminTab('requerimentos');
        }
      }

      updateReqMotivoRecusa(reqId, motivo) {
        const req = this.db.requerimentos.find(r => r.id === reqId);
        if (req) {
          req.motivoRecusa = motivo;
          this.saveDB();
          this.toast('Motivo da recusa registrado.', 'info');
        }
      }

      renderAdminAtestadosManager() {
        const atestados = this.db.atestados;

        const statuses = [
          'Pendente',
          'Recebido em Análise',
          'Aceito',
          'Recusado'
        ];

        return `
          <div class="bg-white dark:bg-brand-cardDark p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-4 animate-fadeIn">
            <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
              <i class="fa-solid fa-notes-medical text-brand-red"></i> Gerenciamento de Atestados Médicos
            </h3>

            <div class="space-y-4">
              ${atestados.map(a => `
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-brand-darkerBg border border-slate-200 dark:border-slate-700/80 space-y-3 text-xs">
                  <div class="flex flex-wrap justify-between items-center gap-2">
                    <div>
                      <span class="font-bold text-sm text-slate-800 dark:text-slate-100">Atestado (${a.dias} dias) - Data: ${a.dataAtestado}</span>
                      <span class="text-[10px] text-slate-400 block">Aluno: <strong>${a.nomeAluno}</strong> (RM: ${a.rmAluno}) • ${a.curso}</span>
                    </div>
                    <span class="badge-status bg-slate-200 dark:bg-slate-700">${a.status}</span>
                  </div>

                  <p class="text-slate-500"><strong>Arquivo Anexo:</strong> <code class="bg-slate-200 dark:bg-slate-800 px-1.5 py-0.5 rounded font-mono">${a.comprovanteNome || 'atestado.pdf'}</code></p>

                  <div class="pt-3 border-t border-slate-200 dark:border-slate-700 flex flex-wrap items-center gap-3">
                    <label class="font-bold text-xs">Atualizar Status:</label>
                    <select onchange="app.updateAtestadoStatus('${a.id}', this.value)" class="p-2 rounded-xl bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 text-xs font-bold">
                      ${statuses.map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>

                    ${a.status === 'Recusado' ? `
                      <input type="text" value="${a.motivoRecusa || ''}" placeholder="Motivo da recusa do atestado..." onchange="app.updateAtestadoMotivoRecusa('${a.id}', this.value)" class="flex-1 p-2 rounded-xl bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 text-xs">
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      updateAtestadoStatus(ateId, newStatus) {
        const ate = this.db.atestados.find(a => a.id === ateId);
        if (ate) {
          ate.status = newStatus;
          this.saveDB();
          this.toast(`Status do atestado alterado para: ${newStatus}`, 'success');
          this.switchAdminTab('atestados');
        }
      }

      updateAtestadoMotivoRecusa(ateId, motivo) {
        const ate = this.db.atestados.find(a => a.id === ateId);
        if (ate) {
          ate.motivoRecusa = motivo;
          this.saveDB();
          this.toast('Motivo salvo.', 'info');
        }
      }


      /* ===================================================================
         TELA 6: TELA DE VISITANTE
         =================================================================== */
      renderVisitanteView() {
        const viewport = document.getElementById('app-viewport');

        viewport.innerHTML = `
          <div class="space-y-6 animate-fadeIn">
            <!-- Visitor Welcome Banner -->
            <div class="bg-white dark:bg-brand-cardDark rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-500 font-black text-2xl">
                  <i class="fa-solid fa-eye"></i>
                </div>
                <div>
                  <h1 class="text-xl font-black text-slate-900 dark:text-white">Área de Acesso Institucional (Visitante)</h1>
                  <p class="text-xs text-slate-500">Acesse orientações públicas e consulte o calendário acadêmico da instituição</p>
                </div>
              </div>

              <button onclick="app.logout()" class="px-4 py-2.5 rounded-xl bg-brand-red text-white font-bold text-xs shadow hover:bg-brand-redHover transition-all flex items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Fazer Login
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <!-- Limited Chatbot -->
              <div>
                ${this.renderChatbotComponent(true)}
              </div>

              <!-- Visitor Calendar -->
              <div>
                ${this.renderCalendarioComponent()}
              </div>
            </div>
          </div>
        `;
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new SAVEApp();
    });
  </script>
</body>
</html>
